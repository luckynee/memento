[package]
name = "mementod"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["embed-onnx", "embed-candle"]
embed-onnx = ["fastembed/onnx", "fastembed/ort-download-binaries-rustls-tls"]
embed-candle = ["fastembed/bert-text", "dep:candle-core"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
candle-core = { version = "0.11.0", optional = true }
fastembed.workspace = true
memento-core = { path = "../memento-core" }
qdrant-client.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
