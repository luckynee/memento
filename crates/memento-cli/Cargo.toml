[package]
name = "memento-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "memento"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
memento-core = { path = "../memento-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde_json = "1.0.154"
serde = "1.0.229"

[dev-dependencies]
tempfile = "3.27.0"
