[package]
name = "memento-cli"
version.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[[bin]]
name = "memento"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
dialoguer = "=0.12.0"
flate2 = "1.1.2"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
memento-core = { path = "../memento-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
sha2 = "0.10.9"
serde_json = "1.0.154"
serde = "1.0.229"
tar = "0.4.44"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
