[package]
name = "memento-mcp"
version.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
memento-core = { path = "../memento-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "=3.11.0", features = ["transport-io", "schemars"] }
schemars = "1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
