name: Build check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/release.yml"
      - "scripts/native-smoke.sh"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-check.yml"
      - ".github/workflows/release.yml"
      - "scripts/native-smoke.sh"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binaries
        run: |
          cargo build --locked --release -p memento-cli -p memento-mcp --target "${{ matrix.target }}"
          cargo build --locked --release -p mementod --target "${{ matrix.target }}"
      - name: Native daemon smoke test
        shell: bash
        run: scripts/native-smoke.sh "target/${{ matrix.target }}/release"
