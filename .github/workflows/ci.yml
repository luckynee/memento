name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  adapter:
    name: OpenCode adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/native-smoke.sh install.sh scripts/sync-adapter-skills.sh
      - run: scripts/sync-adapter-skills.sh --check

  qdrant:
    name: Qdrant integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:6333/readyz; then
                  exit 0
              fi
              sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: cargo test -p mementod
        env:
          MEMENTO_TEST_QDRANT_URL: http://127.0.0.1:6334
